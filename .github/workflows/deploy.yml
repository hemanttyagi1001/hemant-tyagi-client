name: Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: halexo-vps
    steps:
      - uses: actions/checkout@v5

      - name: Build and deploy
        run: |
          docker compose -f docker-compose.yml up -d --build
          docker image prune -f
